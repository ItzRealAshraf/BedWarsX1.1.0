    name-ar: "كسّار الأسرة"
    desc-ar: "اكسر 10 أسرة الأسبوع ده"
  finals-15:
    icon: DIAMOND_SWORD
    stat: finals
    target: 15
    xp: 250
    coins: 120
    name: "Final Blow"
    desc: "Get 15 final kills this week"
    name-ar: "الضربة الأخيرة"
    desc-ar: "اعمل 15 فاينال كيل الأسبوع ده"
  games-10:
    icon: CLOCK
    stat: games
    target: 10
    xp: 150
    coins: 80
    name: "Dedicated Player"
    desc: "Play 10 matches this week"
    name-ar: "لاعب مواظب"
    desc-ar: "العب 10 ماتشات الأسبوع ده"
  voidkills-5:
    icon: ENDER_PEARL
