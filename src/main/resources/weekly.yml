# ===========================================================================
#  BedWarsX - weekly missions (new in 1.1.0)               Author: ASHRAF ELHENAWY
#  They show at the top of /bw achievements. Every Monday the progress and the completed
#  missions of every player are reset, so they can be completed (and rewarded) again.
#  Lifetime stats (wins, kills, level, coins ...) are NEVER reset - only the weekly counters are.
#
#  stat: wins, kills, finals, beds, games, deaths, voidkills, flawless   -> counted during the current week
#        game-kills, game-finals, game-beds                              -> reached inside ONE match
#  Reload with /bw reload.  enabled: false on a block hides it.
# ===========================================================================

enabled: true

missions:
  kills-25:
    icon: IRON_SWORD
    stat: kills
    target: 25
    xp: 200
    coins: 100
    name: "Hunter of the Week"
    desc: "Get 25 kills this week"
    name-ar: "صياد الأسبوع"
    desc-ar: "اعمل 25 كيل الأسبوع ده"
  wins-3:
    icon: GOLDEN_APPLE
    stat: wins
    target: 3
    xp: 250
    coins: 150
    name: "Weekly Winner"
    desc: "Win 3 matches this week"
    name-ar: "فايز الأسبوع"
    desc-ar: "اكسب 3 ماتشات الأسبوع ده"
  beds-10:
    icon: RED_BED
    stat: beds
