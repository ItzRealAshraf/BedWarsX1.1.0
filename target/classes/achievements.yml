# ===========================================================================
#  BedWarsX - achievements                         Author: ASHRAF ELHENAWY
#  Every achievement gives XP (raises the BedWars level) + Coins when its goal is reached.
#  Reload with /bw reload.  Open the menu with /bw achievements (or from the Stats menu).
#
#  stat (what is counted):
#    wins, kills, finals, beds, games, deaths   - lifetime totals
#    beststreak   - best win streak          level      - BedWars level
#    voidkills    - players you knocked into the void
#    flawless     - matches won without dying
#    game-kills, game-finals, game-beds         - reached inside ONE match
#  target: the number to reach   |   xp / coins: the rewards (0 = nothing)
#  name-ar / desc-ar are used when language is ar in config.yml.
#  Add your own by copying a block. enabled: false hides one.
# ===========================================================================

enabled: true
check-on-join: true     # players unlock what they already earned (old stats) when they join
title: true             # big "ACHIEVEMENT" title in the lobby (in a match it is chat + sound only)

