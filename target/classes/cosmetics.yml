# ===========================================================================
#  BedWarsX - Cosmetics (Kill / Final Kill / Victory / Death effects, Trails, Projectile effects,
#  Bed designs and Shop NPC skins).  Author: ASHRAF ELHENAWY.  Reload with /bw reload
#
#  HOW IT WORKS
#   * Players earn Coins in games (config.yml -> coins) and buy cosmetics in the Cosmetics chest (/bw cosmetics
#     or the ender chest in the BedWars lobby).
#   * free-all: true  -> EVERYTHING is unlocked and free for everyone.
#   * price: 0        -> that cosmetic is free.   price: 500 -> costs 500 coins.   enabled: false -> hidden.
#   * permission: "bwx.cos.vip" -> anyone with that permission gets it without paying.
#   * Admin: /bw coins <give|take|set> <player> <n>   |   /bw cosmetics give <player> <category.id|all>
#
#  ITEM FIELDS
#   name, material (icon), price, lore, type, particle: [A|B]  ("A|B" = use A, or B on versions where A was renamed)
#   type:  burst (kill/final/death), column, helix, ring, rain (animated), lightning (strikes: N), firework (shape, colors)
#          trail (trail + projectile categories)   aura (bed, decor: floating item)   npc (entity, profession, villager-type)
#   count, spread, speed, height-offset, radius, height, duration (ticks), interval (victory: ticks between repeats)
#   sound (e.g. entity.generic.explode), volume, pitch, colors: ["ff0000"], rainbow: true, size (dust size), block (for BLOCK particles)
# ===========================================================================

enabled: true
free-all: false

